name: Publish to NPM

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

jobs:
  publish:
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-latest' }}

    if: github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')

    # setup-node's `registry-url` writes an .npmrc that references ${NODE_AUTH_TOKEN}. Yarn 1 aborts
    # ("Failed to replace env in config") on any step where that variable is unset, so the job gets a
    # placeholder; public installs don't need a real token. The real NPM_TOKEN is set only on the
    # steps that publish (step env overrides this), and it is written to .npmrc only after
    # `yarn install`, so dependency install scripts never see it.
    env:
      NODE_AUTH_TOKEN: XXXXX-XXXXX-XXXXX-XXXXX

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag must be on the main branch. Aborting."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: yarn install --frozen-lockfile

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build
        run: npx tsc -p tsconfig.json

      - name: Authenticate to NPM
        run: |
          echo "registry=https://registry.npmjs.org/" > .npmrc
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare and publish models
        working-directory: packages/models
        run: |
          mkdir -p dist
          cp -r ../../dist/packages/models/src/* dist/
          if [ -n "$VERSION" ]; then
            CURRENT=$(node -p "require('./package.json').version")
            [ "$CURRENT" != "$VERSION" ] && npm version "$VERSION" --no-git-tag-version || true
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare and publish api
        working-directory: packages/plugin-plane
        run: |
          mkdir -p dist
          cp -r ../../dist/packages/plugin-plane/src/* dist/
          if [ -n "$VERSION" ]; then
            CURRENT=$(node -p "require('./package.json').version")
            [ "$CURRENT" != "$VERSION" ] && npm version "$VERSION" --no-git-tag-version || true
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
